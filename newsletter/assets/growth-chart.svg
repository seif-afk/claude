<svg width="536" height="240" viewBox="0 0 536 240" xmlns="http://www.w3.org/2000/svg">
  <!-- Growth/metrics chart illustration — for data-driven newsletter sections -->
  <defs>
    <linearGradient id="chartBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F20"/>
      <stop offset="100%" style="stop-color:#0C1430"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0044FF;stop-opacity:0.25"/>
      <stop offset="100%" style="stop-color:#0044FF;stop-opacity:0"/>
    </linearGradient>
    <linearGradient id="lineFill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0044FF"/>
      <stop offset="100%" style="stop-color:#00BFFF"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="536" height="240" fill="url(#chartBg)" rx="16"/>

  <!-- Grid lines -->
  <g stroke="#1A2040" stroke-width="0.5" opacity="0.5">
    <line x1="60" y1="40" x2="500" y2="40"/>
    <line x1="60" y1="80" x2="500" y2="80"/>
    <line x1="60" y1="120" x2="500" y2="120"/>
    <line x1="60" y1="160" x2="500" y2="160"/>
    <line x1="60" y1="200" x2="500" y2="200"/>
  </g>

  <!-- Y-axis labels -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#3A4570">
    <text x="48" y="44" text-anchor="end">500</text>
    <text x="48" y="84" text-anchor="end">400</text>
    <text x="48" y="124" text-anchor="end">300</text>
    <text x="48" y="164" text-anchor="end">200</text>
    <text x="48" y="204" text-anchor="end">100</text>
  </g>

  <!-- X-axis labels -->
  <g font-family="'Courier New', monospace" font-size="9" fill="#3A4570" text-anchor="middle">
    <text x="100" y="220">W1</text>
    <text x="180" y="220">W2</text>
    <text x="260" y="220">W3</text>
    <text x="340" y="220">W4</text>
    <text x="420" y="220">W5</text>
    <text x="500" y="220">W6</text>
  </g>

  <!-- Area fill under the line -->
  <polygon points="100,180 180,160 260,140 340,110 420,80 500,50 500,200 100,200" fill="url(#areaFill)"/>

  <!-- The growth line -->
  <polyline points="100,180 180,160 260,140 340,110 420,80 500,50" fill="none" stroke="url(#lineFill)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow2)"/>

  <!-- Data points -->
  <g filter="url(#glow2)">
    <circle cx="100" cy="180" r="4" fill="#0044FF" stroke="#0066FF" stroke-width="1.5"/>
    <circle cx="180" cy="160" r="4" fill="#0055FF" stroke="#0077FF" stroke-width="1.5"/>
    <circle cx="260" cy="140" r="4" fill="#0066FF" stroke="#0088FF" stroke-width="1.5"/>
    <circle cx="340" cy="110" r="4" fill="#0077FF" stroke="#00AAFF" stroke-width="1.5"/>
    <circle cx="420" cy="80" r="4" fill="#0088FF" stroke="#00BBFF" stroke-width="1.5"/>
    <circle cx="500" cy="50" r="5" fill="#00BFFF" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>

  <!-- Latest data point highlight -->
  <circle cx="500" cy="50" r="12" fill="none" stroke="#00BFFF" stroke-width="0.5" opacity="0.4"/>

  <!-- Metric badge -->
  <rect x="440" y="22" width="56" height="22" rx="6" fill="#00BFFF" opacity="0.15"/>
  <text x="468" y="37" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" font-weight="bold" fill="#00BFFF">+142%</text>

  <!-- Title -->
  <text x="60" y="28" font-family="'Trebuchet MS', sans-serif" font-size="11" font-weight="bold" fill="#5A6890" letter-spacing="2">SUBSCRIBER GROWTH</text>
</svg>
