<svg width="536" height="280" viewBox="0 0 536 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Abstract network/connection visualization — futuristic SaaS feel -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0F20;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#0C1430;stop-opacity:1"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0044FF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00BFFF;stop-opacity:0.6"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#0066FF;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#0066FF;stop-opacity:0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:#00BFFF;stop-opacity:0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="536" height="280" fill="url(#bgGrad)"/>

  <!-- Grid dots pattern -->
  <g opacity="0.08">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#FFFFFF"/>
    </pattern>
    <rect width="536" height="280" fill="url(#dots)"/>
  </g>

  <!-- Connection lines -->
  <g stroke="url(#lineGrad)" stroke-width="1" fill="none" opacity="0.5">
    <line x1="80" y1="200" x2="180" y2="120"/>
    <line x1="180" y1="120" x2="268" y2="140"/>
    <line x1="268" y1="140" x2="360" y2="90"/>
    <line x1="360" y1="90" x2="456" y2="160"/>
    <line x1="180" y1="120" x2="220" y2="60"/>
    <line x1="268" y1="140" x2="300" y2="210"/>
    <line x1="360" y1="90" x2="340" y2="180"/>
    <line x1="340" y1="180" x2="300" y2="210"/>
    <line x1="300" y1="210" x2="180" y2="220"/>
    <line x1="180" y1="220" x2="80" y2="200"/>
    <line x1="80" y1="200" x2="120" y2="100"/>
    <line x1="120" y1="100" x2="180" y2="120"/>
    <line x1="456" y1="160" x2="420" y2="230"/>
    <line x1="420" y1="230" x2="340" y2="180"/>
    <line x1="220" y1="60" x2="360" y2="90"/>
  </g>

  <!-- Glow spots -->
  <circle cx="268" cy="140" r="60" fill="url(#glowBlue)"/>
  <circle cx="360" cy="90" r="40" fill="url(#glowCyan)"/>

  <!-- Primary nodes -->
  <g filter="url(#glow)">
    <!-- Center node (largest) -->
    <circle cx="268" cy="140" r="8" fill="#0044FF" stroke="#00AAFF" stroke-width="1.5"/>
    <circle cx="268" cy="140" r="14" fill="none" stroke="#0044FF" stroke-width="0.5" opacity="0.3"/>

    <!-- Major nodes -->
    <circle cx="180" cy="120" r="6" fill="#0055FF" stroke="#0088FF" stroke-width="1"/>
    <circle cx="360" cy="90" r="6" fill="#0077FF" stroke="#00BFFF" stroke-width="1"/>
    <circle cx="300" cy="210" r="5" fill="#0055FF" stroke="#0088FF" stroke-width="1"/>
    <circle cx="80" cy="200" r="5" fill="#0044FF" stroke="#0066FF" stroke-width="1"/>
    <circle cx="456" cy="160" r="5" fill="#0066FF" stroke="#00AAFF" stroke-width="1"/>

    <!-- Minor nodes -->
    <circle cx="220" cy="60" r="4" fill="#0066FF" stroke="#00BFFF" stroke-width="0.8"/>
    <circle cx="340" cy="180" r="4" fill="#0055FF" stroke="#0088FF" stroke-width="0.8"/>
    <circle cx="120" cy="100" r="3.5" fill="#0044FF" stroke="#0066FF" stroke-width="0.8"/>
    <circle cx="180" cy="220" r="3.5" fill="#0044FF" stroke="#0066FF" stroke-width="0.8"/>
    <circle cx="420" cy="230" r="3.5" fill="#0055FF" stroke="#0088FF" stroke-width="0.8"/>
  </g>

  <!-- Tiny floating particles -->
  <g fill="#00BFFF" opacity="0.3">
    <circle cx="150" cy="80" r="1.2"/>
    <circle cx="310" cy="50" r="1"/>
    <circle cx="400" cy="130" r="1.2"/>
    <circle cx="200" cy="180" r="1"/>
    <circle cx="480" cy="100" r="0.8"/>
    <circle cx="50" cy="140" r="0.8"/>
    <circle cx="370" cy="240" r="1"/>
    <circle cx="130" cy="250" r="0.8"/>
    <circle cx="500" cy="220" r="1"/>
    <circle cx="240" cy="240" r="0.8"/>
  </g>

  <!-- Center badge text -->
  <text x="268" y="260" text-anchor="middle" font-family="'Trebuchet MS', sans-serif" font-size="10" fill="#3A4570" letter-spacing="3" text-transform="uppercase">LEAD GENERATION NETWORK</text>
</svg>
